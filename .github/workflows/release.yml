name: Release installers

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Match package version to tag
        run: |
          node -e "const version=require('./package.json').version; const expected='v'+version; if(process.env.GITHUB_REF_NAME!==expected){console.error('Tag '+process.env.GITHUB_REF_NAME+' must match package version '+expected); process.exit(1)}"
      - name: Require a commit from main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - run: npm run check
      - name: Run Electron integration flows
        run: xvfb-run --auto-servernum npm run test:integration

  mac-arm64:
    needs: validate
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report signing mode
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::Apple signing secrets are not configured. This DMG will be unsigned."
          fi
      - name: Build Apple Silicon DMG
        run: npm run package:mac:arm64
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - uses: actions/upload-artifact@v7
        with:
          name: installer-mac-arm64
          path: release/CraftCV-*-mac-arm64.dmg
          if-no-files-found: error
          retention-days: 14

  mac-x64:
    needs: validate
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Report signing mode
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
        run: |
          if [ -z "$CSC_LINK" ]; then
            echo "::warning::Apple signing secrets are not configured. This DMG will be unsigned."
          fi
      - name: Build Intel DMG
        run: npm run package:mac:x64
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - uses: actions/upload-artifact@v7
        with:
          name: installer-mac-x64
          path: release/CraftCV-*-mac-x64.dmg
          if-no-files-found: error
          retention-days: 14

  linux-x64:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Linux AppImage
        run: npm run package:linux:x64
      - uses: actions/upload-artifact@v7
        with:
          name: installer-linux-x64
          path: release/CraftCV-*-linux-x64.AppImage
          if-no-files-found: error
          retention-days: 14

  publish-draft:
    needs: [mac-arm64, mac-x64, linux-x64]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installer-*
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum CraftCV-* > SHA256SUMS.txt
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" release-assets/* \
              --draft \
              --verify-tag \
              --generate-notes \
              --title "CraftCV $tag" \
              --repo "$GITHUB_REPOSITORY"
          fi
          echo "A draft release is ready for installer verification and manual publication."
